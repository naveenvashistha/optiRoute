name: optiroute

services:
  redis:
    image: redis:8.8
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    # Keep sessions and the semantic cache temporary: no RDB snapshots or AOF.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # Use the image you already built; do not pull it from a registry.
    image: optiroute-backend:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    init: true
    env_file:
      - ./backend/.env
    environment:
      # These values override host-specific settings in backend/.env.
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /app/models/intent_mlp_model.joblib
      ROUTER_MODEL_PATH: /app/models/optiroute_router_model
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      # Python is already installed; this does not need curl or a paid API call.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: optiroute-frontend:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    # Local access only for now; the public HTTPS entry point comes later.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # BusyBox wget is available in the frontend's Alpine-based Nginx image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Compose creates a shared network automatically. Service names become DNS names:
# frontend -> backend:8000 -> redis:6379. Backend and Redis have no published ports.
