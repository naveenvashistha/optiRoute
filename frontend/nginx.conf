server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Reject oversized API request bodies before forwarding them to Python.
        client_max_body_size 128k;

        # Docker's DNS resolves the backend service on the shared container network.
        # Resolve at request time so replacing the backend container is supported.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;

        # Preserve the /api prefix and query string expected by FastAPI.
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliver chat tokens as they arrive instead of buffering the response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        # Let React handle browser routes when no matching static file exists.
        try_files $uri $uri/ /index.html;
    }
}
