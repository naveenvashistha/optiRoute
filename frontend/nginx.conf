# This file is included in Nginx's http context. Only chat POSTs get a rate key;
# empty keys leave health checks, static files, and other routes unrestricted.
map "$request_method:$uri" $chat_rate_key {
    default "";
    "POST:/api/ask" $binary_remote_addr;
    "POST:/api/ask/" $binary_remote_addr;
}

limit_req_zone $chat_rate_key zone=chat_per_ip:1m rate=10r/m;

# Every chat request shares one concurrency counter, regardless of client IP.
# Other requests keep an empty key and do not occupy a chat slot.
map $chat_rate_key $chat_concurrency_key {
    default "chat";
    "" "";
}

limit_conn_zone $chat_concurrency_key zone=chat_global:1m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Reject oversized API request bodies before forwarding them to Python.
        client_max_body_size 128k;

        # Average 10 chat requests/minute per IP, with 3 extra burst requests.
        limit_req zone=chat_per_ip burst=3 nodelay;
        limit_req_status 429;

        # Initial ceiling: 5 active chat requests across all visitors.
        # Streaming requests occupy a slot until they finish or disconnect.
        limit_conn chat_global 5;
        limit_conn_status 429;

        # Docker's DNS resolves the backend service on the shared container network.
        # Resolve at request time so replacing the backend container is supported.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;

        # Preserve the /api prefix and query string expected by FastAPI.
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliver chat tokens as they arrive instead of buffering the response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        # Let React handle browser routes when no matching static file exists.
        try_files $uri $uri/ /index.html;
    }
}
