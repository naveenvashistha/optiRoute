name: Publish frontend image

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      GCP_PROJECT_ID: optiroute-512819
      REGISTRY_HOST: asia-south1-docker.pkg.dev
      IMAGE_NAME: asia-south1-docker.pkg.dev/optiroute-512819/optiroute/frontend
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      - name: Check required configuration
        run: |
          if [[ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            echo "::error::Set the GCP_WORKLOAD_IDENTITY_PROVIDER repository variable before running this workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@optiroute-512819.iam.gserviceaccount.com

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and publish frontend image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summarize published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image_uri="${IMAGE_NAME}:${GITHUB_SHA}"
          printf 'Published frontend image: `%s`\n' "$image_uri" >> "$GITHUB_STEP_SUMMARY"
          printf 'Image digest: `%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
